const BU_APP='kelaskita',BU_FMT=1,BU_PAR=20;
const BU_COL=['settings','siswa','guru','setGuru','bobot','presensi','tugas','kumpul','nilai'];
const BU_LB={settings:'Pengaturan aplikasi',siswa:'Data siswa',guru:'Data guru mapel',setGuru:'Set awal guru',bobot:'Bobot nilai',presensi:'Presensi',tugas:'Tugas',kumpul:'Pengumpulan tugas',nilai:'Nilai'};
let buB=null;
const buCard=()=>`<div class="card" style="max-width:760px"><b style="display:flex;gap:8px;align-items:center;color:#0147ac;margin-bottom:6px">${ic('dl',18)}Backup & Restore Database</b>
 <p style="margin:0 0 12px;color:#64748b;font-size:12.5px;line-height:1.6">Unduh seluruh data (siswa, guru, presensi, tugas, pengumpulan, nilai, bobot, dan pengaturan) sebagai satu file JSON, atau pulihkan data dari file backup. Foto/file tugas di Google Drive tidak ikut dalam file; yang tersimpan hanya tautannya.</p>
 <button class="btn yl" id="buDl">${ic('dl',16)}Unduh Backup Sekarang</button>
 <hr style="border:0;border-top:1px solid #e2e8f0;margin:18px 0">
 <label for="buFile">Pulihkan dari File Backup</label><input type="file" id="buFile" accept=".json,application/json">
 <div id="buBox"></div>
 <p style="margin:14px 0 0;color:#64748b;font-size:12px;line-height:1.6">${ic('alert',14)} File backup berisi data pribadi (termasuk NISN, NIP, dan password siswa/guru). Simpan di tempat aman dan jangan dibagikan.</p></div>`;
function buSave(b,pre){const d=new Date(),p=n=>String(n).padStart(2,'0'),nm=`${pre}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.json`;
 const u=URL.createObjectURL(new Blob([JSON.stringify(b)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=nm;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return nm}
async function buBuild(){const k={},j={};for(const c of BU_COL){k[c]=await DB.all(c);j[c]=Object.keys(k[c]).length}
 return{app:BU_APP,format:BU_FMT,dibuat:new Date().toISOString(),dibuat_oleh:(S.user&&S.user.email)||'admin',nama_aplikasi:CFG.nama,jumlah:j,koleksi:k}}
function buParse(t){let b;try{b=JSON.parse(t)}catch{throw new Error('File bukan JSON yang valid.')}
 if(!b||b.app!==BU_APP||!b.koleksi||typeof b.koleksi!=='object')throw new Error('File ini bukan file backup KelasKita.');
 if(+b.format!==BU_FMT)throw new Error('Versi format file backup tidak didukung.');
 for(const c of BU_COL){const m=b.koleksi[c];if(!m||typeof m!=='object'||Array.isArray(m))throw new Error(`Data "${BU_LB[c]}" tidak ditemukan di file backup.`);
  for(const id in m){if(!id||/[\/]/.test(id)||id==='.'||id==='..')throw new Error(`ID dokumen tidak valid pada "${BU_LB[c]}".`);const d=m[id];if(!d||typeof d!=='object'||Array.isArray(d))throw new Error(`Isi dokumen "${id}" pada "${BU_LB[c]}" tidak valid.`)}}
 return b}
// Jalankan operasi bersamaan (maks. BU_PAR) agar cepat; berhenti begitu ada yang gagal
async function buPool(items,fn,tick){let i=0,bad=null;const w=async()=>{while(!bad&&i<items.length){const it=items[i++];try{await fn(it);tick()}catch(e){bad=bad||e;throw e}}};
 await Promise.all(Array.from({length:Math.min(BU_PAR,items.length)},w))}
async function buRestore(b,mode,onp){let cur='persiapan';
 try{const del=[];
  if(mode==='replace')for(const c of BU_COL){if(c==='settings')continue;const ex=await DB.all(c);for(const id in ex)if(!(id in b.koleksi[c]))del.push([c,id])}
  const put=[];for(const c of BU_COL)for(const id in b.koleksi[c])put.push([c,id]);
  // Rules Firestore melarang menimpa kiriman berstatus "Dikonfirmasi" dengan status lain. Dokumen seperti itu dihapus dulu lalu dibuat ulang (delete dan create diizinkan).
  const kx=await DB.all('kumpul'),kb=b.koleksi.kumpul,lock=new Set(Object.keys(kx).filter(id=>kx[id]&&kx[id].status==='Dikonfirmasi'&&kb[id]&&kb[id].status!=='Dikonfirmasi'));
  const tot=del.length+put.length;let n=0;const tick=()=>onp(++n,tot);onp(0,tot);
  cur='penghapusan data';await buPool(del,([c,id])=>DB.del(c,id),tick);
  cur='penulisan data';await buPool(put,async([c,id])=>{if(c==='kumpul'&&lock.has(id))await DB.del(c,id);await DB.set(c,id,b.koleksi[c][id])},tick)
 }catch(e){throw new Error(`Pemulihan berhenti saat ${cur}: ${(e&&e.message)||e}. File backup pengaman sudah terunduh; perbaiki masalahnya lalu ulangi.`)}}
function buInit(){
 $('#buDl').onclick=async()=>{const x=$('#buDl');x.disabled=true;try{const b=await buBuild(),n=buSave(b,'backup-kelaskita'),t=BU_COL.reduce((a,c)=>a+b.jumlah[c],0);toast(`Backup diunduh (${t} data): ${n}`,'ok')}catch(e){toast('Gagal membuat backup: '+((e&&e.message)||e),'err')}x.disabled=false};
 $('#buFile').onchange=e=>{const f=e.target.files[0],bx=$('#buBox');buB=null;bx.innerHTML='';if(!f)return;
  (async()=>{try{if(f.size>100*1048576)throw new Error('Ukuran file backup terlalu besar.');
   const b=buB=buParse(await f.text()),dt=b.dibuat?new Date(b.dibuat):null,tm=dt&&!isNaN(dt)?dt.toLocaleString('id-ID',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
   const rd=(v,ck,t,d)=>`<label style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid #e2e8f0;border-radius:12px;cursor:pointer;font-weight:400;margin:0"><input type="radio" name="bum" value="${v}" ${ck?'checked':''} style="width:auto;margin-top:3px"><span><b>${t}</b><br><small style="color:#64748b">${d}</small></span></label>`;
   bx.innerHTML=`<p style="margin:14px 0 8px;color:#64748b;font-size:12.5px">Backup dibuat: <b>${esc(tm)}</b></p>
   <div class="tw"><table><tr><th>Data</th><th>Jumlah di file backup</th></tr>${BU_COL.map(c=>`<tr><td>${esc(BU_LB[c])}</td><td>${Object.keys(b.koleksi[c]).length}</td></tr>`).join('')}</table></div>
   <div style="display:grid;gap:8px;margin:12px 0">${rd('merge',true,'Gabungkan (disarankan)','Menambah data yang belum ada dan menimpa data dengan ID yang sama. Data lain di database tidak diubah.')}${rd('replace',false,'Ganti total','Database dibuat sama persis dengan file backup. Data yang tidak ada di file backup dihapus permanen.')}</div>
   <button class="btn r" id="buRun">${ic('up',16)}Pulihkan Data</button>`;
   $('#buRun').onclick=buRun}catch(x){e.target.value='';toast((x&&x.message)||String(x),'err')}})()};
}
async function buRun(){
 const b=buB;if(!b)return toast('Pilih file backup terlebih dahulu.','warn');
 const rep=document.querySelector('#kk input[name=bum]:checked')?.value==='replace';
 if(!await ask(rep?'Database akan dibuat sama persis dengan file backup. Data yang tidak ada di file backup akan dihapus permanen. Sebelum dimulai, backup pengaman data saat ini diunduh otomatis. Lanjutkan?':'Data dengan ID yang sama akan ditimpa isi file backup, data lain tidak diubah. Sebelum dimulai, backup pengaman data saat ini diunduh otomatis. Lanjutkan?'))return;
 const pm=modal('<h3 style="margin-top:0">Memulihkan data…</h3><div class="pbar"><i id="pb"></i></div><p id="pt" style="margin:0;font-weight:700;color:#0147ac">Membuat backup pengaman…</p><p style="color:#64748b;font-size:12px">Jangan tutup halaman ini sampai selesai.</p>');
 const onp=(d,t)=>{const p=t?Math.round(d/t*100):100;$('#pb',pm).style.width=p+'%';$('#pt',pm).textContent=`Memproses ${d} dari ${t} data… ${p}%`};
 try{buSave(await buBuild(),'pengaman-sebelum-restore-kelaskita');await buRestore(b,rep?'replace':'merge',onp);
  const st=await DB.all('settings');if(st.app)CFG=st.app;pm.remove();buB=null;toast('Data berhasil dipulihkan dari backup.','ok');shell('set')
 }catch(e){pm.remove();toast((e&&e.message)||String(e),'err')}}

// Kompres gambar di sisi klien agar upload lebih cepat & stabil (maks 1600px, JPEG)
async function kompresGambar(f){
 if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<400000)return f;
 try{const bmp=await createImageBitmap(f),sc=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));if(!bl||bl.size>=f.size)return f;
  return new File([bl],f.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'})}catch(e){return f}
}
// Upload ke Google Drive via Apps Script.
// PENTING: pakai fetch + text/plain TANPA listener upload (XHR upload.onprogress memicu preflight CORS yang ditolak Apps Script).
async function upFile(f,name,onp,meta){
 if(!CFG.gasUrl){if(IS_PREVIEW){for(let i=1;i<=10;i++){onp&&onp(i*10);await new Promise(r=>setTimeout(r,80))}return 'preview://'+encodeURIComponent(f.name)}throw new Error('URL Apps Script belum diatur admin.')}
 if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(CFG.gasUrl))throw new Error('URL Apps Script tidak valid (harus diawali https://script.google.com/macros/s/.../exec).');
 f=await kompresGambar(f);
 const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=()=>no(new Error('File tidak dapat dibaca'));r.readAsDataURL(f)});
 // progres simulasi (fetch tidak menyediakan progres upload): naik perlahan sampai 90%
 let p=3,tm=setInterval(()=>{p=Math.min(90,p+Math.max(1,Math.round((90-p)/12)));onp&&onp(p)},500);
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),240000);
 try{
  let res;
  try{res=await fetch(CFG.gasUrl,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({folderId:CFG.folderId||'',name:name+'_'+f.name,mime:f.type||'application/octet-stream',data:b64,mapel:meta&&meta.mapel||'',kelas:meta&&meta.kelas||''}),signal:ctl.signal})}
  catch(e){if(e.name=='AbortError')throw new Error('Waktu habis, coba lagi');throw new Error('Tidak dapat terhubung ke Apps Script. Pastikan Web App di-deploy dengan akses "Siapa saja" (Anyone) lalu cek URL /exec di Pengaturan Admin.')}
  const txt=await res.text();let j;
  try{j=JSON.parse(txt)}catch(e){throw new Error('Respons Apps Script tidak valid. Biasanya Web App belum di-deploy untuk "Anyone" atau belum diotorisasi.')}
  if(!j.url)throw new Error(j.error||'Upload gagal');
  onp&&onp(100);return j.url;
 }finally{clearInterval(tm);clearTimeout(to)}
}

async function tesGAS(url,folderId){

 return j;
}

function pvInfo(u){

  if(m=u.match(/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([\w-]+)/i))return{src:`https://docs.google.com/${m[1]}/d/${m[2]}/preview`};
  if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/i)||u.match(/drive\.google\.com\/(?:open|uc)\?[^#]*?\bid=([\w-]+)/i))return{src:`https://drive.google.com/file/d/${m[1]}/preview`};
  if(m=u.match(/drive\.google\.com\/drive\/folders\/([\w-]+)/i))return{src:`https://drive.google.com/embeddedfolderview?id=${m[1]}#list`};
 }
